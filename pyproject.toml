[project]
name = "mini-gpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hmx299792", email = "hmx299792@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.2.6",
    "tensorboard>=2.21.0",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[project.scripts]
mini-gpt = "mini_gpt:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]